# Replaces gen-admission-secret.sh. cert-manager issues the serving certificate into the secret
# the Deployment mounts, and rotates it. A 10-year self-signed CA generated by a shell script at
# install time is a certificate nobody will ever rotate, because nothing reminds them to.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: system
spec:
  dnsNames:
    - webhook-service.system.svc
    - webhook-service.system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
