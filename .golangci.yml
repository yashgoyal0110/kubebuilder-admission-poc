version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Test helpers panic deliberately when the environment is wrong, because failing loudly at
      # startup beats every test failing with a confusing error.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
