---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-devices-yashgoyal-dev-v1alpha1-device
  failurePolicy: Fail
  name: mdevice.kb.io
  rules:
  - apiGroups:
    - devices.yashgoyal.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - devices
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-devices-yashgoyal-dev-v1alpha1-device
  failurePolicy: Fail
  name: vdevice.kb.io
  rules:
  - apiGroups:
    - devices.yashgoyal.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - devices
  sideEffects: None
